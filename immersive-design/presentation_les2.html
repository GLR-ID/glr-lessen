    "contentHtml": "<div class=\"content-col\"><div class=\"info-card amber\"><div class=\"info-card-title\">Checkpoint 1: Zie Je Dit?</div><div class=\"info-card-text\">Dan klaar.<ul><li>De repo staat op GitHub, <strong>Library</strong> niet, <strong>.meta</strong> wel</li><li>Een teamgenoot kan de repo klonen en het project openen zonder fouten</li><li>Jullie weten wie welke prefab en branch heeft</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card red\"><div class=\"info-card-title\">Lukt Het Niet?</div><div class=\"info-card-text\"><ul><li><strong>Library staat erin:</strong> controleer of .gitignore de Unity-versie is. Staat Library al in een commit, vraag docent of teamgenoot, of begin opnieuw met een nieuwe repo</li><li><strong>Roze materialen of missing scripts:</strong> .meta niet gecommit. Vink ze aan in Changes, commit en push</li></ul></div></div></div>",
    "notes": "Loop langs elk team. Laat een teamgenoot echt clonen en openen, niet alleen zeggen dat het kan. Library al in de repo: er is geen knop in GitHub Desktop om dit achteraf te herstellen. Help het team een nieuwe repo te starten met de Unity-.gitignore. Pas daarna door naar C#.",
    "deepdive": {
      "analogy": "Eerst controleren dat iedereen dezelfde werkplaats heeft, dan pas gaan bouwen.",
      "whatIsWhat": "<strong>.gitignore:</strong> lijst met bestanden die Git negeert. Staat Library al in de repo, dan helpt een .gitignore achteraf niet meer.<br><strong>Missing script:</strong> Unity vindt het .meta bestand niet en kan het script niet koppelen.",
      "trap": "Zeggen dat het werkt zonder dat een ander het heeft geprobeerd.",
      "rule": "Het werkt pas als een ander het kan klonen en openen."
    }
  },
  {
    "category": "C# Basis",
    "title": "Van JavaScript naar C#",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>JavaScript</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">let</span> snelheid = 90;\n<span class=\"kw\">function</span> <span class=\"fn\">draai</span>() { }\nconsole.<span class=\"fn\">log</span>(<span class=\"str\">\"hoi\"</span>);</pre></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>C#</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">float</span> snelheid = 90f;\n<span class=\"kw\">void</span> <span class=\"fn\">Draai</span>() { }\n<span class=\"type\">Debug</span>.<span class=\"fn\">Log</span>(<span class=\"str\">\"hoi\"</span>);</pre></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Wat Is Anders?</div><div class=\"info-card-text\"><ul><li>Je schrijft het <strong>type</strong> erbij</li><li><code>;</code> en <code>{ }</code> zijn verplicht</li><li><strong>Hoofdletters</strong> tellen: <code>Debug</code> is niet <code>debug</code></li><li><code>class Naam : MonoBehaviour</code></li></ul></div></div></div>",
    "notes": "Studenten kennen JavaScript. Dit is geen uitleg wat een variabele of functie is, alleen wat anders is in C#. Laat de twee blokken naast elkaar zien. Een class die MonoBehaviour uitbreidt kan als script op een object. Een kommagetal als float eindigt op f.",
    "deepdive": {
      "analogy": "JavaScript is een gesprek waarin je alles mag zeggen. C# is een formulier: elk vakje heeft een type en een puntkomma.",
      "whatIsWhat": "<strong>Type:</strong> wat voor waarde erin past (int, float, bool, string).<br><strong>void:</strong> de methode geeft niets terug.<br><strong>MonoBehaviour:</strong> basisklasse voor scripts op een GameObject.",
      "differences": "JS: let en function, types vrij. C#: type vooraf, methodes met returntype, case-sensitive net als JS maar strenger over typen.",
      "trap": "<code>float x = 1.5;</code> zonder f geeft een fout.",
      "rule": "Type, naam, waarde, puntkomma."
    }
  },
  {

    "images": [
      {

    "contentHtml": "\n                        <div class=\"content-col text-stack\"><div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\" spellcheck=\"false\">Script Maken</div><div class=\"step-item\"><div class=\"step-num\">1</div><div spellcheck=\"false\">Maak in je eigen prefab-map een map <strong>Scripts</strong>.</div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div spellcheck=\"false\">Rechtsklik in <strong>Project</strong>: <strong>Create &gt; Scripting &gt; MonoBehaviour Script</strong>.</div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div spellcheck=\"false\">Naam: <strong>Draaier</strong>. Let op de hoofdletter D.</div></div><div class=\"step-item\"><div class=\"step-num\">4</div><div spellcheck=\"false\">Sleep <strong>Draaier</strong> op een kubus in je prefab.</div></div><div class=\"step-item\"><div class=\"step-num\">5</div><div spellcheck=\"false\">Dubbelklik op het script. De code editor opent.</div></div></div></div><div class=\"content-col\"><div class=\"info-card amber\"><div class=\"info-card-title\" spellcheck=\"false\">Teamregel</div><div class=\"info-card-text\" spellcheck=\"false\">Werk in je <strong>eigen prefab</strong>. Open de gedeelde scene niet om te testen.</div></div></div></div><div class=\"content-col media-col\"><figure class=\"media-fig\" data-img=\"img/les2/13-script-in-project.png\"><img src=\"img/les2/13-script-in-project.png\"><div class=\"media-ph-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4z\"></path><circle cx=\"12\" cy=\"13\" r=\"3.5\"></circle></svg></div><div class=\"media-ph-text\">Project-venster met map Assets/Scripts en daarin het script Draaier (MonoBehaviour Script)</div><code class=\"media-ph-file\" spellcheck=\"false\">img/les2/13-script-in-project.png</code></figure></div>\n                    ",
    "notes": "Koppel aan de teamregels: prefab-first. Laat studenten een kubus in een eigen prefab maken (Prefab Mode: dubbelklik op de prefab). Het menu is in Unity 6 ook te vinden onder Assets > Create > Scripting; rechtsklik in Project werkt altijd. De klassenaam komt uit de bestandsnaam, dus meteen goed typen. Controleer in de Inspector dat Draaier als component op de kubus staat.",
    "deepdive": {
      "analogy": "De map Scripts is je gereedschapskast. Alle code komt daar, zodat je niets kwijtraakt.",
      "whatIsWhat": "<strong>MonoBehaviour:</strong> de basis waardoor een script op een GameObject kan.<br><strong>Prefab Mode:</strong> je prefab apart openen en bewerken.",
      "trap": "De bestandsnaam later aanpassen. Dan klopt de klassenaam niet meer.",
      "rule": "Een script krijgt meteen de goede naam, met hoofdletter."
    }
  },
  {
    "category": "Scripts",
    "title": "Hoe Ziet een Script Eruit?",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Assets/Scripts/Draaier.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>;\n\n<span class=\"kw\">public</span> <span class=\"kw\">class</span> <span class=\"type\">Draaier</span> : <span class=\"type\">MonoBehaviour</span>\n{\n    <span class=\"kw\">void</span> <span class=\"type\">Start</span>() { }\n    <span class=\"kw\">void</span> <span class=\"type\">Update</span>() { }\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Regel voor Regel</div><div class=\"info-card-text\"><ul><li><code>using UnityEngine;</code> haalt de code van Unity erbij. Zoals <code>import</code> in JS</li><li><code>public class Draaier : MonoBehaviour</code> is jouw script. De naam is gelijk aan de bestandsnaam</li><li><code>void</code> geeft niets terug. <code>{ }</code> omsluiten het blok</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Start en Update</div><div class=\"info-card-text\"><ul><li><strong>Start:</strong> één keer, als het spel begint</li><li><strong>Update:</strong> elk frame, steeds opnieuw</li><li>Unity roept ze zelf aan</li></ul></div></div></div>",
    "notes": "Loop de code regel voor regel door op het scherm. using: welke bibliotheek je gebruikt, vergelijk met import. class: het script is een klasse; de naam moet gelijk zijn aan de bestandsnaam. : MonoBehaviour betekent dat het script op een GameObject kan. void betekent dat de methode niets teruggeeft. Accolades { } omsluiten een blok, net als in JavaScript. Start draait één keer, Update elk frame.",
    "deepdive": {
      "analogy": "Start is het opstarten van een machine. Update is het draaien van het wiel, de hele tijd.",
      "whatIsWhat": "<strong>using:</strong> zegt welke code-bibliotheek je gebruikt.<br><strong>class:</strong> de bouwtekening van je script.<br><strong>MonoBehaviour:</strong> maakt van de klasse een script voor een GameObject.<br><strong>Start / Update:</strong> namen die Unity herkent.",
      "trap": "Code die één keer moet gebeuren in Update zetten. Dan gebeurt het honderden keren.",
      "rule": "Eenmalig in Start, doorlopend in Update."
    }
  },

    "images": [

        "file": "15-console-hallo-unity.png",

    "contentHtml": "\n                        <div class=\"content-col text-stack\"><div class=\"content-col\"><div class=\"code-container\"><div class=\"jb-header-tab\">\n                    <div style=\"display:flex; align-items:center; gap:6px;\">\n                        <span class=\"jb-csharp-icon\">C#</span>\n                        <span class=\"jb-filename\">Script.cs</span>\n                    </div>\n                    <button class=\"code-copy-btn\" onclick=\"SlideDeck.copyCode(this)\" title=\"Kopieer code\">Kopieer</button>\n                </div><div class=\"code-header\"><span spellcheck=\"false\">Draaier.cs: Start</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre spellcheck=\"false\"><code spellcheck=\"false\"><span class=\"jb-keyword\">void</span> <span class=\"jb-method\">Start</span>()\n{\n    <span class=\"jb-type\">Debug</span>.<span class=\"jb-method\">Log</span>(\"<span class=\"jb-type\">Hallo</span> <span class=\"jb-type\">Unity</span>\");\n}</code></pre></div></div><div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\" spellcheck=\"false\">Testen</div><div class=\"step-item\"><div class=\"step-num\">1</div><div spellcheck=\"false\">Typ de regel in <strong>Start</strong>. Sla op met <strong>Ctrl/Cmd + S</strong>.</div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div spellcheck=\"false\">Ga terug naar Unity. Open je prefab-scene en klik <strong>Play</strong>.</div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div spellcheck=\"false\">Open <strong>Window &gt; General &gt; Console</strong>.</div></div><div class=\"step-item\"><div class=\"step-num\">4</div><div spellcheck=\"false\">Zie je <strong>Hallo Unity</strong>? Dit is <code spellcheck=\"false\">console.log</code> in C#.</div></div></div></div></div><div class=\"content-col media-col\"><figure class=\"media-fig\" data-img=\"img/les2/15-console-hallo-unity.png\"><img src=\"img/les2/15-console-hallo-unity.png\"><div class=\"media-ph-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4z\"></path><circle cx=\"12\" cy=\"13\" r=\"3.5\"></circle></svg></div><div class=\"media-ph-text\">Window &gt; General &gt; Console met de melding Hallo Unity en het Play-icoon actief</div><code class=\"media-ph-file\" spellcheck=\"false\">img/les2/15-console-hallo-unity.png</code></figure></div>\n                    ",
    "notes": "Debug.Log is de C# versie van console.log. Let op de puntkomma en de hoofdletters D en L. Unity compileert automatisch na het opslaan; even wachten. Wie niets ziet: staat het script echt op de kubus, en staat de kubus in de scene die speelt? Een prefab op zich draait niet; zet hem in een eigen test-scene of gebruik Prefab Mode als je alleen wilt zien of de code compileert.",
    "deepdive": {
      "analogy": "Debug.Log is een briefje dat je code naar jou schrijft: ik ben hier geweest.",
      "whatIsWhat": "<strong>Console:</strong> het venster waar meldingen en fouten verschijnen.<br><strong>Debug.Log:</strong> schrijf een tekst naar de Console.<br><strong>Play:</strong> start je scene.",
      "differences": "JavaScript: console.log(). Unity: Debug.Log(). Zelfde doel.",
      "trap": "Vergeten op te slaan, of de puntkomma weglaten.",
      "rule": "Eerst opslaan, dan Play."
    }
  },
  {
    "category": "C# Basis",
    "title": "Typen en Variabelen in C#",
    "contentHtml": "<div class=\"content-col\"><div class=\"info-card\"><div class=\"info-card-title\">Drie Basis Typen</div><div class=\"info-card-text\"><ul><li><code>float</code>: kommagetal <code>1.5f</code></li><li><code>int</code>: heel getal <code>3</code></li><li><code>bool</code>: <code>true</code> of <code>false</code></li></ul></div></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Voorbeeld</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">float</span> snelheid = 90f;\n<span class=\"kw\">int</span> levens = 3;\n<span class=\"kw\">bool</span> draaien = <span class=\"kw\">true</span>;\n<span class=\"kw\">string</span> naam = <span class=\"str\">\"Kubus\"</span>;\n<span class=\"type\">Vector3</span> plek = <span class=\"kw\">new</span> <span class=\"type\">Vector3</span>(0, 1, 0);</pre></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Nog Twee Typen</div><div class=\"info-card-text\"><ul><li><code>string</code>: tekst tussen aanhalingstekens</li><li><code>Vector3</code>: drie getallen x, y, z voor een plek of richting</li><li>Kommagetal? Zet <code>f</code> erachter: <code>90f</code></li></ul></div></div></div>",
    "notes": "Studenten kennen variabelen. Alleen het type is nieuw. float, int, bool en string kennen ze als idee uit JS. Vector3 is een Unity-type met drie getallen: een plek (x, y, z) of een richting. Het is een nieuw type, daarom new Vector3(...). De f achter een kommagetal is verplicht bij float. JS: let x = 5; C#: int x = 5;",
    "deepdive": {
      "analogy": "Een variabele is een doosje met een etiket. Het type bepaalt wat erin past.",
      "whatIsWhat": "<strong>float:</strong> getal met komma.<br><strong>int:</strong> heel getal.<br><strong>bool:</strong> aan of uit.<br><strong>string:</strong> tekst.<br><strong>Vector3:</strong> x, y en z samen.",
      "differences": "JavaScript kiest het type zelf (let, const). C# wil dat jij het type opschrijft.",
      "trap": "<code>float x = 1.5;</code> zonder f geeft een fout.",
      "rule": "Type, naam, waarde, puntkomma."
    }
  },
  {

    "images": [
      {
        "file": "17-inspector-snelheid.png",
        "want": "Inspector van de kubus met het component Draaier (Script) en het veld Snelheid met waarde 90"

    "contentHtml": "\n                        <div class=\"content-col text-stack\"><div class=\"content-col\"><div class=\"code-container\"><div class=\"jb-header-tab\">\n                    <div style=\"display:flex; align-items:center; gap:6px;\">\n                        <span class=\"jb-csharp-icon\">C#</span>\n                        <span class=\"jb-filename\">Draaier.cs</span>\n                    </div>\n                    <button class=\"code-copy-btn\" onclick=\"SlideDeck.copyCode(this)\" title=\"Kopieer code\">Kopieer</button>\n                </div><div class=\"code-header\"><span spellcheck=\"false\">Draaier.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre spellcheck=\"false\"><code spellcheck=\"false\"><span class=\"jb-keyword\">public</span> <span class=\"jb-keyword\">class</span> <span class=\"jb-type\">Draaier</span> : <span class=\"jb-type\">MonoBehaviour</span>\n{\n    <span class=\"jb-keyword\">public</span> <span class=\"jb-keyword\">float</span> <span class=\"jb-plain\">snelheid</span> = <span class=\"jb-number\">90f</span>;\n\n    <span class=\"jb-attr\">[SerializeField]</span> <span class=\"jb-keyword\">private</span> <span class=\"jb-keyword\">float</span> <span class=\"jb-plain\">hoogte</span> = <span class=\"jb-number\">1f</span>;\n\n    <span class=\"jb-keyword\">void</span> <span class=\"jb-method\">Start</span>() { }\n    <span class=\"jb-keyword\">void</span> <span class=\"jb-method\">Update</span>() { }\n}</code></pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\" spellcheck=\"false\">Twee Manieren</div><div class=\"info-card-text\" spellcheck=\"false\"><ul><li spellcheck=\"false\"><code spellcheck=\"false\">public</code>: zichtbaar in de <strong>Inspector</strong> en voor andere scripts</li><li spellcheck=\"false\"><code spellcheck=\"false\">[SerializeField] private</code>: zichtbaar in de Inspector, alleen voor dit script</li><li spellcheck=\"false\"><code spellcheck=\"false\">snelheid</code> wordt <strong>Snelheid</strong>. Pas de waarde aan tijdens <strong>Play</strong></li></ul></div></div></div></div><div class=\"content-col media-col\"><figure class=\"media-fig\" data-img=\"img/les2/17-inspector-snelheid.png\"><img src=\"img/les2/17-inspector-snelheid.png\"><div class=\"media-ph-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4z\"></path><circle cx=\"12\" cy=\"13\" r=\"3.5\"></circle></svg></div><div class=\"media-ph-text\">Inspector van de kubus met het component Draaier (Script) en het veld Snelheid met waarde 90</div><code class=\"media-ph-file\" spellcheck=\"false\">img/les2/17-inspector-snelheid.png</code></figure></div>\n                    ",
    "notes": "Sla op en ga terug naar Unity: in de Inspector staan nu Snelheid en Hoogte bij Draaier. Unity maakt van de variabelenaam een nette titel met hoofdletter. public mag ook door andere scripts gebruikt worden. [SerializeField] private zet hem in de Inspector, maar andere scripts kunnen er niet bij. Voor deze les is public prima. Wijzigingen tijdens Play gaan weg na Stop; dat is normaal.",
    "deepdive": {
      "analogy": "Een public variabele is een draaiknop aan de buitenkant van het apparaat.",
      "whatIsWhat": "<strong>public:</strong> zichtbaar buiten het script, ook in de Inspector.<br><strong>[SerializeField] private:</strong> alleen in de Inspector, niet voor andere scripts.<br><strong>Tip:</strong> [Range(0, 360)] geeft een schuifbalk. [Header(\"Beweging\")] zet een kopje boven je velden.<br><strong>Inspector:</strong> venster met alle instellingen van het object.",
      "trap": "Waarde veranderen tijdens Play en verwachten dat die blijft na Stop.",
      "rule": "Wil je het in de Inspector, zet er public of [SerializeField] voor."
    }
  },
  {
    "category": "Beweging",
    "title": "Stap 6: Object Laten Draaien",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Draaier.cs: Update</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">void</span> <span class=\"fn\">Update</span>()\n{\n    transform.<span class=\"fn\">Rotate</span>(0, snelheid * <span class=\"type\">Time</span>.deltaTime, 0);\n}</pre></div><div class=\"info-card cyan\"><div class=\"info-card-title\">Time.deltaTime</div><div class=\"info-card-text\">De tijd tussen twee frames. Zo draait het object overal even snel.</div></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Met een vinkje</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">public bool</span> draaien = <span class=\"kw\">true</span>;\n\n<span class=\"kw\">void</span> <span class=\"fn\">Update</span>()\n{\n    <span class=\"kw\">if</span> (draaien)\n    {\n        transform.<span class=\"fn\">Rotate</span>(0, snelheid * <span class=\"type\">Time</span>.deltaTime, 0);\n    }\n}</pre></div><div class=\"info-card purple\"><div class=\"info-card-title\">Draaien Wordt een Vinkje</div><div class=\"info-card-text\">Een <code>bool</code> is een vinkje in de Inspector. Zet het uit tijdens Play.</div></div></div>",
    "notes": "Rotate(x, y, z) draait in graden. Y is om de verticale as. Bij 90 draait het object een kwartslag per seconde. Zonder Time.deltaTime draait het per frame en is een snelle pc sneller dan een bril. De if kennen ze uit JavaScript; alleen de syntax is nieuw: haakjes om de voorwaarde, accolades om het blok. Laat ze het vinkje aan en uit zetten tijdens Play.",
    "deepdive": {
      "analogy": "Time.deltaTime is een klokje: je draait niet per stap maar per seconde.",
      "whatIsWhat": "<strong>transform:</strong> positie, rotatie en schaal van het object.<br><strong>Rotate:</strong> draai het object een stukje.<br><strong>Graden:</strong> 360 is een hele cirkel.",
      "trap": "Time.deltaTime weglaten. Dan hangt de snelheid af van de computer.",
      "rule": "Beweging in Update vermenigvuldig je met Time.deltaTime."
    }
  },
  {
    "category": "C# Basis",
    "title": "Eigen Methodes",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Draaier.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">void</span> <span class=\"type\">Update</span>()\n{\n    <span class=\"type\">Draai</span>(snelheid);\n}\n\n<span class=\"kw\">void</span> <span class=\"type\">Draai</span>(<span class=\"kw\">float</span> tempo)\n{\n    <span class=\"kw\">float</span> stap = tempo * <span class=\"type\">Time</span>.deltaTime;\n    transform.<span class=\"type\">Rotate</span>(0, stap, 0);\n}</pre></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Met een waarde terug</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">float</span> <span class=\"type\">Dubbel</span>(<span class=\"kw\">float</span> x)\n{\n    <span class=\"kw\">return</span> x * 2f;\n}\n\n<span class=\"kw\">bool</span> <span class=\"type\">IsSnel</span>()\n{\n    <span class=\"kw\">return</span> snelheid &gt; 100f;\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Zoals een JS function</div><div class=\"info-card-text\"><ul><li>JS: <code>function draai(tempo) { }</code></li><li>C#: <code>void Draai(float tempo) { }</code></li><li><code>void</code>: geeft niets terug. <code>float</code> of <code>bool</code>: geeft een waarde terug met <code>return</code></li></ul></div></div></div>",

    "contentHtml": "<div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\">Speler Bouwen</div><div class=\"step-item\"><div class=\"step-num\">1</div><div><strong>3D Object > Capsule</strong>, naam <strong>Speler</strong>. <strong>Tag</strong> bovenin de Inspector: <strong>Player</strong></div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div>Verwijder <strong>Capsule Collider</strong>. <strong>Add Component > Character Controller</strong></div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div>Sleep <strong>Main Camera</strong> onder Speler. Position 0, 0.6, 0</div></div><div class=\"step-item\"><div class=\"step-num\">4</div><div>Voeg <strong>Speler.cs</strong> toe. Test met <strong>Play</strong> in het Game-venster</div></div><div class=\"step-item\"><div class=\"step-num\">5</div><div>Heeft je team al een speler? Gebruik die.</div></div></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Speler.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>;\n<span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>.<span class=\"type\">InputSystem</span>;\n\n<span class=\"kw\">public</span> <span class=\"kw\">class</span> <span class=\"type\">Speler</span> : <span class=\"type\">MonoBehaviour</span>\n{\n    <span class=\"kw\">public</span> <span class=\"kw\">float</span> tempo = 3f;\n    <span class=\"type\">CharacterController</span> cc;\n\n    <span class=\"kw\">void</span> <span class=\"type\">Start</span>() { cc = <span class=\"type\">GetComponent</span>&lt;<span class=\"type\">CharacterController</span>&gt;(); }\n\n    <span class=\"kw\">void</span> <span class=\"type\">Update</span>()\n    {\n        <span class=\"kw\">var</span> k = <span class=\"type\">Keyboard</span>.current;\n        <span class=\"type\">Vector3</span> m = <span class=\"type\">Vector3</span>.zero;\n        <span class=\"kw\">if</span> (k.wKey.isPressed) m += transform.forward;\n        <span class=\"kw\">if</span> (k.sKey.isPressed) m -= transform.forward;\n        <span class=\"kw\">if</span> (k.dKey.isPressed) m += transform.right;\n        <span class=\"kw\">if</span> (k.aKey.isPressed) m -= transform.right;\n        cc.<span class=\"type\">Move</span>(m * tempo * <span class=\"type\">Time</span>.deltaTime);\n        <span class=\"kw\">float</span> d = 90 * <span class=\"type\">Time</span>.deltaTime;\n        <span class=\"kw\">if</span> (k.rightArrowKey.isPressed) transform.<span class=\"type\">Rotate</span>(0, d, 0);\n        <span class=\"kw\">if</span> (k.leftArrowKey.isPressed) transform.<span class=\"type\">Rotate</span>(0, -d, 0);\n    }\n}</pre></div></div>",

    "contentHtml": "<div class=\"content-col text-stack\"><div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\">Deur Bouwen</div><div class=\"step-item\"><div class=\"step-num\">1</div><div>Maak in je eigen prefab een leeg object <strong>Deur</strong> met daaronder een Cube <strong>Paneel</strong></div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div>Op <strong>Deur</strong>: <strong>Box Collider</strong>, <strong>Is Trigger</strong> aan, groter dan het Paneel</div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div>Voeg het script <strong>Deur</strong> toe. Sleep <strong>Paneel</strong> in het veld</div></div><div class=\"step-item\"><div class=\"step-num\">4</div><div>Speler erheen lopen: de deur gaat open. Daarna weg: dicht</div></div></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Deur.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">public</span> <span class=\"type\">GameObject</span> paneel;\n\n<span class=\"kw\">void</span> <span class=\"type\">OnTriggerEnter</span>(<span class=\"type\">Collider</span> other)\n{\n    <span class=\"kw\">if</span> (other.<span class=\"type\">CompareTag</span>(<span class=\"str\">\"Player\"</span>)) paneel.<span class=\"type\">SetActive</span>(<span class=\"kw\">false</span>);\n}\n\n<span class=\"kw\">void</span> <span class=\"type\">OnTriggerExit</span>(<span class=\"type\">Collider</span> other)\n{\n    <span class=\"kw\">if</span> (other.<span class=\"type\">CompareTag</span>(<span class=\"str\">\"Player\"</span>)) paneel.<span class=\"type\">SetActive</span>(<span class=\"kw\">true</span>);\n}</pre></div></div></div><div class=\"content-col media-col\"><figure class=\"media-fig media-placeholder\" data-img=\"img/les2/26-deur-hierarchy.png\"><img src=\"img/les2/26-deur-hierarchy.png\" alt=\"Hierarchy en Inspector van Deur: kind Paneel, Box Collider met Is Trigger, script Deur met veld Paneel gevuld\" onload=\"this.parentNode.classList.remove('media-placeholder')\" onerror=\"this.remove()\"><div class=\"media-ph-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/></svg></div><div class=\"media-ph-text\">Hierarchy en Inspector van Deur: kind Paneel, Box Collider met Is Trigger, script Deur met veld Paneel gevuld</div><code class=\"media-ph-file\">img/les2/26-deur-hierarchy.png</code></figure></div>",
    "notes": "Dit is de eerste echte interactie: alle onderdelen kennen ze al. De trigger zit op het lege object Deur, het Paneel is het zichtbare deel. Zet het script niet op het Paneel zelf: als je het uitzet, gaat ook het script uit. Als je met SetActive(false) werkt, verdwijnt de deur. Alternatief voor een schuivende deur: paneel.transform.position = new Vector3(...). Maak er een prefab van in je eigen map. Test met de Speler uit stap 9.",
    "deepdive": {
      "analogy": "De Deur is de sensor naast de schuifdeur. Het Paneel is de deur zelf.",
      "whatIsWhat": "<strong>Trigger-zone:</strong> onzichtbaar gebied dat reageert.<br><strong>Paneel:</strong> het zichtbare deel dat verdwijnt.<br><strong>Prefab:</strong> Deur met Paneel samen, herbruikbaar.",
      "trap": "Het script op het Paneel zetten en dat Paneel uitzetten. Dan is ook het script uit en gaat de deur nooit meer dicht.",
      "rule": "Trigger en zichtbaar deel zijn twee objecten."
    }
  },
  {
    "category": "Interactie",
    "title": "Stap 12: Een Toets Indrukken",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Deur.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>.<span class=\"type\">InputSystem</span>;\n\n<span class=\"kw\">bool</span> inRange;\n\n<span class=\"kw\">void</span> <span class=\"type\">OnTriggerEnter</span>(<span class=\"type\">Collider</span> other)\n{\n    <span class=\"kw\">if</span> (other.<span class=\"type\">CompareTag</span>(<span class=\"str\">\"Player\"</span>)) inRange = <span class=\"kw\">true</span>;\n}\n<span class=\"comm\">// OnTriggerExit: zelfde, met inRange = false</span>\n\n<span class=\"kw\">void</span> <span class=\"type\">Update</span>()\n{\n    <span class=\"kw\">if</span> (inRange &amp;&amp; <span class=\"type\">Keyboard</span>.current.eKey.wasPressedThisFrame)\n        paneel.<span class=\"type\">SetActive</span>(!paneel.activeSelf);\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Regel voor Regel</div><div class=\"info-card-text\"><ul><li><code>inRange</code> is een vlaggetje: staat de speler in de zone?</li><li><code>&amp;&amp;</code> betekent en: beide moeten waar zijn. <code>wasPressedThisFrame</code> is alleen waar in het frame van indrukken</li><li><code>!</code> draait om: was het paneel aan, dan wordt het uit</li></ul></div></div></div>",
    "notes": "Voeg dit toe aan Deur.cs uit de vorige stap: haal de SetActive-regels uit Enter en Exit weg. Nu staat in Enter en Exit alleen nog het vlaggetje, de toets doet het werk. isPressed is waar zolang je de toets vasthoudt, wasPressedThisFrame maar een keer per indrukken. Dezelfde Input aanpak als bij Speler.cs. Controleer dat using UnityEngine.InputSystem bovenaan staat.",
    "deepdive": {
      "analogy": "Het vlaggetje is een lampje bij de deur: staat je speler in de zone, dan brandt het. Alleen als het lampje brandt, werkt de E-toets.",
      "whatIsWhat": "<strong>bool:</strong> waar of niet waar.<br><strong>&amp;&amp;:</strong> en.<br><strong>!:</strong> niet, draait een bool om.<br><strong>wasPressedThisFrame:</strong> alleen in het frame waarin je indrukt.",
      "differences": "JS kent ook && en !. In C# moet de voorwaarde echt een bool zijn.",
      "trap": "isPressed gebruiken: dan klapt de deur elk frame open en dicht zolang je vasthoudt.",
      "rule": "Een keer indrukken is wasPressedThisFrame."
    }
  },
  {
    "category": "Interactie",
    "title": "Stap 13: Voorwerp Oppakken en Score",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Score.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">public</span> <span class=\"kw\">class</span> <span class=\"type\">Score</span> : <span class=\"type\">MonoBehaviour</span>\n{\n    <span class=\"kw\">public</span> <span class=\"kw\">int</span> punten;\n\n    <span class=\"kw\">public</span> <span class=\"kw\">void</span> <span class=\"type\">VoegToe</span>(<span class=\"kw\">int</span> aantal)\n    {\n        punten += aantal;\n        <span class=\"type\">Debug</span>.<span class=\"type\">Log</span>(<span class=\"str\">\"Punten: \"</span> + punten);\n    }\n}</pre></div></div><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Munt.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">void</span> <span class=\"type\">OnTriggerEnter</span>(<span class=\"type\">Collider</span> other)\n{\n    <span class=\"kw\">if</span> (!other.<span class=\"type\">CompareTag</span>(<span class=\"str\">\"Player\"</span>)) <span class=\"kw\">return</span>;\n    other.<span class=\"type\">GetComponent</span>&lt;<span class=\"type\">Score</span>&gt;().<span class=\"type\">VoegToe</span>(1);\n    <span class=\"type\">Destroy</span>(gameObject);\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Regel voor Regel</div><div class=\"info-card-text\"><ul><li><code>public void VoegToe</code>: andere scripts mogen deze methode aanroepen</li><li><code>other.GetComponent&lt;Score&gt;()</code>: pak het Score-script van de speler</li><li><code>!</code> betekent niet: geen speler? <code>return</code> stopt. <code>Destroy(gameObject)</code> haalt de munt weg</li></ul></div></div></div>",
    "notes": "Maak een Sphere of Cube, zet Is Trigger aan en voeg Munt.cs toe. Zet Score.cs op de Speler. Een score op het muntscript zelf werkt niet: elke munt heeft zijn eigen getal. Daarom een Score script op de Speler en de munt roept VoegToe aan. other.GetComponent pakt het script van het andere object. Zonder Score op de Speler krijg je een NullReferenceException. += telt op. Bij gameObject met kleine g bedoel je het object waar dit script op staat. Maak een prefab van de Munt en plaats er meer van.",
    "deepdive": {
      "analogy": "De Speler is een portemonnee (Score). De munt stopt zichzelf erin en verdwijnt.",
      "whatIsWhat": "<strong>int:</strong> heel getal.<br><strong>public void VoegToe:</strong> methode met parameter, aan te roepen door andere scripts.<br><strong>gameObject:</strong> het object waar dit script op staat.<br><strong>Destroy:</strong> haalt een object uit de scene.",
      "trap": "Score niet op de Speler gezet: NullReferenceException. Of de score op de munt zelf zetten: elke munt telt apart.",
      "rule": "Score hoort bij de Speler, niet bij de munt."
    }
  },
  {
    "category": "Interactie",
    "title": "Stap 14: Objecten Laten Verschijnen",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Spawner.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"comm\">// using UnityEngine.InputSystem;</span>\n\n<span class=\"kw\">public</span> <span class=\"type\">GameObject</span> bal;\n\n<span class=\"kw\">void</span> <span class=\"type\">Update</span>()\n{\n    <span class=\"kw\">var</span> k = <span class=\"type\">Keyboard</span>.current;\n    <span class=\"kw\">if</span> (k.spaceKey.wasPressedThisFrame)\n    {\n        <span class=\"kw\">var</span> kopie = <span class=\"type\">Instantiate</span>(\n            bal, transform.position,\n            transform.rotation);\n        <span class=\"type\">Destroy</span>(kopie, 3f);\n    }\n}</pre></div></div><div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\">Voorbereiding</div><div class=\"step-item\"><div class=\"step-num\">1</div><div>Maak een <strong>Sphere</strong> met een <strong>Rigidbody</strong></div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div>Sleep hem van de Hierarchy naar <strong>Project</strong>: een prefab. Verwijder hem uit de scene</div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div>Zet <strong>Spawner</strong> op een leeg object boven de vloer. Sleep de prefab in het veld <strong>Bal</strong></div></div></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Regel voor Regel</div><div class=\"info-card-text\"><ul><li><code>Instantiate</code> maakt een kopie: wat, waar, welke draaiing</li><li><code>Destroy(kopie, 3f)</code> haalt hem na 3 seconden weg</li><li>Druk <strong>Space</strong> in Play</li></ul></div></div></div>",
    "notes": "Instantiate(prefab, positie, rotatie) maakt een kopie van een prefab in de scene. Het veld Bal moet naar een prefab uit het Project-venster wijzen, niet naar een object in de scene. Destroy met een tweede getal wacht zoveel seconden. Zonder Destroy blijven er honderden ballen in je scene. Dezelfde Input aanpak als eerder. De using regel staat bovenaan het script, boven de class. Hetzelfde patroon voor items die verschijnen bij een trigger.",
    "deepdive": {
      "analogy": "Het prefab is een stempel. Instantiate drukt een nieuwe afdruk in de scene.",
      "whatIsWhat": "<strong>Instantiate:</strong> maakt een kopie van een prefab.<br><strong>Prefab:</strong> herbruikbaar object als bestand.<br><strong>Destroy(obj, 3f):</strong> verwijdert obj na 3 seconden.",
      "trap": "Een object uit de scene in het veld slepen in plaats van de prefab uit Project. Dan kopieer je een ding dat zelf ook al in de scene staat. Ook: geen Destroy, de scene loopt vol.",
      "rule": "Instantiate een prefab, en ruim de kopieën op."
    }
  },
  {
    "category": "Interactie",
    "title": "Interactie-Ideeën voor Je Eigen Game",
    "contentHtml": "<div class=\"content-col\"><div class=\"info-card\"><div class=\"info-card-title\">Deuren en Voorwerpen</div><div class=\"info-card-text\">Kies 2 of 3 die bij jouw concept passen.<ul><li><strong>Deur, knop of lift:</strong> trigger, toets E, SetActive of position</li><li><strong>Verzamelbaar:</strong> trigger, Score script, Destroy</li><li><strong>Valstrik en respawn:</strong> trigger, <code>transform.position</code> naar je startplek</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Licht en Beweging</div><div class=\"info-card-text\"><ul><li><strong>Licht aan/uit:</strong> <code>licht.enabled = !licht.enabled</code> bij een toets</li><li><strong>Bewegend platform:</strong> Update, <code>Translate</code>, Time.deltaTime</li><li><strong>Bericht:</strong> <code>Debug.Log</code> in een trigger</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Geluid en Kleur</div><div class=\"info-card-text\"><ul><li><strong>Geluid:</strong> <code>geluid.Play()</code> met een AudioSource</li><li><strong>Checkpoint:</strong> trigger onthoudt een plek, valstrik zet je daarheen</li><li><strong>Kleur veranderen:</strong> <code>material.color</code> bij een trigger</li></ul></div></div></div>",
    "notes": "Dit is een menu. Studenten kiezen er 2 of 3 die bij hun eigen concept uit les 1 passen. Alle bouwstenen kennen ze al: trigger, toets, SetActive, GetComponent, Destroy, Instantiate, transform.position. Nieuw zijn alleen Light.enabled (een Light component aan of uit, via een public Light licht veld) en AudioSource.Play (public AudioSource geluid). Bij respawn met een Character Controller: zet eerst cc.enabled = false, verplaats, zet hem weer aan. Anders corrigeert de controller de plek weer terug.",
    "deepdive": {
      "analogy": "De ideeën zijn een menukaart. Je hoeft niet alles te bestellen, kies wat bij je game past.",
      "whatIsWhat": "<strong>Light.enabled:</strong> lamp aan of uit.<br><strong>AudioSource.Play():</strong> speelt het geluid van de AudioSource.<br><strong>transform.position:</strong> verplaatst een object naar een plek.",
      "trap": "Alles tegelijk willen bouwen. Of een respawn met transform.position op een speler met Character Controller: die springt terug. Zet de controller eerst even uit.",
      "rule": "Kies 2 of 3, bouw ze klein en test elke stap."
    }
  },
  {
    "category": "Checkpoint",
    "title": "Checkpoint 3: Je Interacties Werken",
    "contentHtml": "<div class=\"content-col\"><div class=\"info-card amber\"><div class=\"info-card-title\">Checkpoint 3: Zie Je Dit?</div><div class=\"info-card-text\">Dan goed.<ul><li>De <strong>Speler</strong> beweegt en de camera meedraait</li><li>Een trigger reageert, in de Console of aan het object</li><li>Minstens een interactie werkt</li><li>Console zonder rode errors en gecommit op je eigen branch</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card red\"><div class=\"info-card-title\">Lukt Het Niet?</div><div class=\"info-card-text\"><ul><li><strong>Trigger doet niets:</strong> Is Trigger aan? Tag <strong>Player</strong> op de Speler? Speler heeft Character Controller?</li><li><strong>NullReferenceException:</strong> staat het veld in de Inspector nog op None? Sleep het object erin</li></ul></div></div></div>",
    "notes": "Loop rond en laat studenten hun interactie in Play laten zien. Meest voorkomend: tag niet gezet, Is Trigger vergeten, veld in de Inspector leeg, script op het verkeerde object. Een speler of voorwerp zonder Collider reageert niet. Controleer ook dat Console geen rode errors heeft en dat het werk op een eigen branch staat voor het naar de Pull Request gaat.",
    "deepdive": {
      "analogy": "Een controle voor je verder bouwt.",
      "whatIsWhat": "<strong>Checkpoint:</strong> moment waarop je controleert of alles werkt voor de volgende stap.",
      "trap": "Doorbouwen terwijl de eerste interactie nog niet werkt.",
      "rule": "Eerst een werkende interactie, dan de volgende."
    }
  },
  {
    "category": "Werktijd",
    "title": "Werktijd: Eerste Interacties in Je Eigen Game",
    "contentHtml": "<div class=\"content-col\"><div class=\"info-card\"><div class=\"info-card-title\">Nu Werk Je aan Je Eigen Game</div><div class=\"info-card-text\"><ul><li>Bouw de eerste 2 of 3 interacties in je blockout</li><li>Kies uit de ideeën, en pas ze aan op jouw concept</li><li>Werk in je eigen prefab en op je eigen branch</li></ul></div></div></div><div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\">Zo Werk Je</div><div class=\"step-item\"><div class=\"step-num\">1</div><div><strong>Pull origin</strong> voor je begint</div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div>Commit klein en vaak met <strong>GitHub Desktop</strong></div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div>Werkt iets? Maak een <strong>Pull Request</strong>. Een teamgenoot kijkt mee</div></div><div class=\"step-item\"><div class=\"step-num\">4</div><div>Kom je er niet uit? Vraag het de docent</div></div></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Tip</div><div class=\"info-card-text\"><ul><li>Kleine stappen</li><li>Test na elk stukje</li></ul></div></div></div>",
    "notes": "Dit is geen formele opdracht. De rest van de les is werktijd aan hun eigen game. Loop rond, help bij Inspector-velden, tags en triggers. Wijs op kleine commits en een Pull Request als iets werkt. Teamgenoot reviewt. Niet meer sturen dan nodig.",
    "deepdive": {
      "analogy": "Je hebt gereedschap gekregen. Nu bouw je jouw eigen werkplaats.",
      "whatIsWhat": "<strong>Pull Request:</strong> verzoek om je branch in main te zetten, met review.<br><strong>Commit:</strong> een opgeslagen stap in je werk.",
      "trap": "Lang werken zonder testen of committen. Dan weet je niet meer wat het kapot maakte.",
      "rule": "Klein bouwen, testen, committen."
    }
  }
];
