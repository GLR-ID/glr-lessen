    "contentHtml": "<div class=\"content-col\"><div class=\"info-card\"><div class=\"info-card-title\">Vergelijk de 3 Standen</div><div class=\"info-card-text\"><ul><li><strong>Velocity Tracking:</strong> Gebruikt physics krachten. Botst netjes tegen muren en tafels. (Aanbevolen!)</li><li><strong>Instantaneous:</strong> Plakt direct op hand. Snijdt dwars door muren heen.</li><li><strong>Kinematic:</strong> Volgt hand strak. Voor draaiknoppen en hendels.</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card cyan\"><div class=\"info-card-title\">Wanneer Gebruik Je Wat?</div><div class=\"info-card-text\"><ul><li><strong>Hamer, fles of gereedschap:</strong> <em>Velocity Tracking</em></li><li><strong>Briefje of speelkaart:</strong> <em>Instantaneous</em></li><li><strong>Schuiflade of hendel:</strong> <em>Kinematic</em></li></ul></div></div></div>",
    "notes": "Demonstreer het verschil door een kubus tegen een muur te duwen: bij Instantaneous verdwijnt hij in de muur, bij Velocity Tracking stopt hij netjes.",

      "whatIsWhat": "<strong>Velocity Tracking:</strong> berekent de snelheid van de hand en oefent met AddForce krachten uit op het object.<br><strong>Instantaneous:</strong> overschrijft direct de Transform positie per frame.",
      "trap": "Een zware bijl of hamer op Instantaneous zetten waardoor de speler door muren en kasten heen kan slaan.",
      "rule": "Gebruik altijd Velocity Tracking voor fysieke gereedschappen en wapens."

      "rule": "Een socket heeft altijd een Trigger Collider nodig."
    }

    "category": "Sockets Code",

    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>DeurSlot.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>;\n\n<span class=\"kw\">public</span> <span class=\"kw\">class</span> <span class=\"type\">DeurSlot</span> : <span class=\"type\">MonoBehaviour</span>\n{\n    <span class=\"kw\">public</span> <span class=\"type\">GameObject</span> deur;\n\n    <span class=\"kw\">public</span> <span class=\"kw\">void</span> <span class=\"type\">OpenDeur</span>()\n    {\n        deur.<span class=\"type\">SetActive</span>(<span class=\"kw\">false</span>);\n        <span class=\"type\">Debug</span>.<span class=\"type\">Log</span>(<span class=\"str\">\"Sleutel in slot: Deur geopend!\"</span>);\n    }\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Koppelen in de Inspector</div><div class=\"info-card-text\"><ul><li>Selecteer <strong>Socket_Sleutelgat</strong></li><li>Scroll naar <strong>Interactable Events &gt; Select Entered</strong></li><li>Klik op <code>+</code>, sleep het object met <code>DeurSlot</code> erin</li><li>Kies methode <code>DeurSlot.OpenDeur</code></li></ul></div></div></div>",
    "notes": "Laat studenten zien hoe ze via het plusje bij Interactable Events direct een deur kunnen openen als de sleutel in de socket klikt.",
    "deepdive": {
      "analogy": "Een lichtschakelaar die vanzelf omgaat zodra de sleutel in het contactslot wordt gedraaid.",

      "trap": "Per ongeluk Hover Entered gebruiken in plaats van Select Entered, waardoor de actie al afgaat als je er alleen maar langs beweegt.",
      "rule": "Gebruik Select Entered voor voltooide vergrendelingen."

    "category": "Haptics",
    "title": "Waarom Haptics Cruciaal Zijn in VR",
    "contentHtml": "<div class=\"content-col\"><div class=\"info-card\"><div class=\"info-card-title\">De Ontbrekende Tastzin</div><div class=\"info-card-text\">In VR voel je alleen de plastic controller. Zonder trilling voelt een virtuele wereld leeg en afstandelijk:<ul><li>Een korte puls geeft directe tactiele bevestiging</li><li>Je hersenen geloven dat je het voorwerp echt beet hebt</li><li>Essentieel voor immersie en precisie</li></ul></div></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Twee Trillingsprofielen</div><div class=\"info-card-text\"><ul><li><strong>Hover Haptic:</strong> Subtiele tik (duur 0.05s, kracht 0.2). Laat voelen dat je hand het object aanraakt.</li><li><strong>Select Haptic:</strong> Stevige klik (duur 0.12s, kracht 0.6). Bevestigt dat je het voorwerp vasthebt.</li></ul></div></div></div>",
    "notes": "Leg uit dat VR draait om multisensorische feedback: beeld, geluid en haptics moeten op exact hetzelfde moment gebeuren.",
    "deepdive": {

      "whatIsWhat": "<strong>Haptics:</strong> tactiele feedback opgewekt door vibratiemotoren (LRA of ERM) in de controllers.<br><strong>Amplitude:</strong> de sterkte van de trilling (tussen 0.0 en 1.0).<br><strong>Duration:</strong> de tijdsduur van de puls in seconden.",
      "trap": "De trilling veel te lang aanzetten (bijvoorbeeld 2 seconden), waardoor de hele controller irritant gaat zoemen.",
      "rule": "Houd haptische tikken altijd ultrakort: tussen 0.05 en 0.15 seconden."
    }

    "contentHtml": "<div class=\"content-col text-stack\"><div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>VRHapticTrigger.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>;\n<span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>.<span class=\"type\">XR</span>.<span class=\"type\">Interaction</span>.<span class=\"type\">Toolkit</span>;\n<span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>.<span class=\"type\">XR</span>.<span class=\"type\">Interaction</span>.<span class=\"type\">Toolkit</span>.<span class=\"type\">Interactors</span>;\n\n<span class=\"kw\">public</span> <span class=\"kw\">class</span> <span class=\"type\">VRHapticTrigger</span> : <span class=\"type\">MonoBehaviour</span>\n{\n    [<span class=\"type\">SerializeField</span>] <span class=\"kw\">private</span> <span class=\"kw\">float</span> kracht = <span class=\"num\">0.6f</span>;\n    [<span class=\"type\">SerializeField</span>] <span class=\"kw\">private</span> <span class=\"kw\">float</span> duur = <span class=\"num\">0.12f</span>;\n\n    <span class=\"kw\">public</span> <span class=\"kw\">void</span> <span class=\"type\">GeefTrilling</span>(<span class=\"type\">SelectEnterEventArgs</span> args)\n    {\n        <span class=\"kw\">if</span> (args.interactorObject <span class=\"kw\">is</span> <span class=\"type\">XRBaseInputInteractor</span> controller)\n            controller.<span class=\"type\">SendHapticImpulse</span>(kracht, duur);\n    }\n}</pre></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Regel voor Regel</div><div class=\"info-card-text\"><ul><li><code>args.interactorObject</code>: de controller die het object beetpakt</li><li><code>is XRBaseInputInteractor</code>: checkt of de controller trilmotoren heeft</li><li><code>SendHapticImpulse(kracht, duur)</code>: stuurt de trillingspuls direct naar de hand</li></ul></div></div></div></div><div class=\"content-col media-col\"><figure class=\"media-fig media-placeholder\" data-img=\"img/les3/25-haptic-csharp-script.png\"><img src=\"img/les3/25-haptic-csharp-script.png\" alt=\"Project map: VRHapticTrigger.cs script toegevoegd op een object en geopend in de Inspector\" onload=\"this.parentNode.classList.remove('media-placeholder')\" onerror=\"this.remove()\"><div class=\"media-ph-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/></svg></div><div class=\"media-ph-text\">Project map: VRHapticTrigger.cs script toegevoegd op een object en geopend in de Inspector</div><code class=\"media-ph-file\">img/les3/25-haptic-csharp-script.png</code></figure></div>",
