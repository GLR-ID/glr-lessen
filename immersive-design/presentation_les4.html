n.y</code> in <code>doel</code> gelijk?</li><li>Wanneer kiest de vis een nieuw doelpunt?</li></ul></div></div></div>",

    "contentHtml": "<div class=\"content-col\"><div class=\"steps-card\"><div class=\"info-card-title\">3 Fases van de Worp</div><div class=\"step-item\"><div class=\"step-num\">1</div><div><strong>Uitgooien (E):</strong> Zet dobber vooraan en geef een zet met <code>AddForce</code>.</div></div><div class=\"step-item\"><div class=\"step-num\">2</div><div><strong>Terughalen (Spatie):</strong> Zet <code>trektTerug = true</code> en schuif terug met <code>MoveTowards</code>.</div></div><div class=\"step-item\"><div class=\"step-num\">3</div><div><strong>Bij hengel:</strong> Afstand kleiner dan 0.4? Zet <code>inWater = false</code> voor nieuwe worp.</div></div></div></div><div class=\"content-col\"><div class=\"info-card purple\"><div class=\"info-card-title\">Waarom Bool Flags?</div><div class=\"info-card-text\">Met <code>inWater</code> en <code>trektTerug</code> weet het vis-script precies wat de speler op dat moment doet.</div></div></div>",

      "differences": "<strong>Alleen AddForce gebruiken:</strong> lastig precies naar de hengel richten. <strong>MoveTowards bij terughalen:</strong> komt netjes bij HengelTip aan.",

  {
    "category": "Deel 2: Hengel",
    "title": "Code: VisHengel.cs",
    "contentHtml": "<div class=\"content-col\"><div class=\"code-container\"><div class=\"code-header\"><span>Assets/Scripts/VisHengel.cs</span><button class=\"code-copy-btn\" onclick=\"copyCode(this)\">Kopieer</button></div><pre><span class=\"kw\">using</span> <span class=\"type\">UnityEngine</span>;\n<span class=\"kw\">using</span> <span class=\"type\">UnityEngine.InputSystem</span>;\n\n<span class=\"kw\">public class</span> <span class=\"type\">VisHengel</span> : <span class=\"type\">MonoBehaviour</span> {\n    <span class=\"kw\">public</span> <span class=\"type\">Transform</span> hengelTip;\n    <span class=\"kw\">public</span> <span class=\"type\">Rigidbody</span> dobber;\n    <span class=\"kw\">public float</span> worpKracht = 6f;\n    <span class=\"kw\">public float</span> terugSnelheid = 1.5f;\n    <span class=\"kw\">public bool</span> inWater, trektTerug;\n\n    <span class=\"kw\">void</span> <span class=\"fn\">Update</span>() {\n        <span class=\"comm\">// 1. Uitgooien</span>\n        <span class=\"kw\">if</span> (<span class=\"type\">Keyboard</span>.current.eKey.wasPressedThisFrame\n            &amp;&amp; !inWater) {\n            dobber.isKinematic = <span class=\"kw\">false</span>;\n            dobber.linearVelocity = <span class=\"type\">Vector3</span>.zero;\n            dobber.position = hengelTip.position;\n            dobber.<span class=\"fn\">AddForce</span>(\n                (hengelTip.forward + <span class=\"type\">Vector3</span>.up) * worpKracht,\n                <span class=\"type\">ForceMode</span>.Impulse);\n            inWater = <span class=\"kw\">true</span>;\n        }\n        <span class=\"comm\">// 2. Langzaam terughalen</span>\n        trektTerug = inWater\n            &amp;&amp; <span class=\"type\">Keyboard</span>.current.spaceKey.isPressed;\n        <span class=\"kw\">if</span> (!trektTerug) <span class=\"kw\">return</span>;\n        dobber.isKinematic = <span class=\"kw\">true</span>;\n        <span class=\"kw\">float</span> stap = terugSnelheid * <span class=\"type\">Time</span>.deltaTime;\n        dobber.position = <span class=\"type\">Vector3</span>.<span class=\"fn\">MoveTowards</span>(\n            dobber.position, hengelTip.position, stap);\n        <span class=\"kw\">if</span> (<span class=\"type\">Vector3</span>.<span class=\"fn\">Distance</span>(\n            dobber.position, hengelTip.position) &lt; 0.4f)\n            inWater = <span class=\"kw\">false</span>;\n    }\n}</pre></div><div class=\"info-card cyan\"><div class=\"info-card-title\">Belangrijke Details</div><div class=\"info-card-text\"><ul><li><strong>linearVelocity:</strong> Zet oude beweging op nul voor een strakke worp.</li><li><strong>isKinematic:</strong> Zet zwaartekracht tijdelijk uit tijdens het terughalen.</li><li><strong>Spatie:</strong> Gebruik <code>isPressed</code> om ingedrukt te houden.</li></ul></div></div></div>",
    "notes": "Wijs op de twee Unity 6 punten: linearVelocity (niet het oude velocity) en Keyboard.current uit UnityEngine.InputSystem. Zorg dat isKinematic = false staat voordat linearVelocity wordt gereset.",
    "deepdive": {
      "analogy": "Bij het gooien laat je de zwaartekracht zijn werk doen; bij het binnenhalen trek je zelf aan de lijn.",
      "whatIsWhat": "<strong>linearVelocity:</strong> huidige snelheid en richting van een Rigidbody in Unity 6.<br><strong>isKinematic:</strong> laat script-positie voorgaan op zwaartekracht.",
      "differences": "<strong>wasPressedThisFrame (E):</strong> een keer gooien bij indrukken. <strong>isPressed (Spatie):</strong> blijven intrekken zolang je vasthoudt.",
      "trap": "linearVelocity instellen terwijl isKinematic nog true is (geeft een waarschuwing in Unity 6).",
      "rule": "Zet eerst isKinematic op false voordat je linearVelocity of AddForce gebruikt."
    }

spector</li></ul></div></div></div>",
